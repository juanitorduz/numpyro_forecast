[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "numpyro_forecast"
version = "0.2.3"
description = "A JAX/NumPyro port of Pyro's forecasting module."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Juan Orduz", email = "juanitorduz@gmail.com" },
]
keywords = [
    "bayesian",
    "forecasting",
    "jax",
    "numpyro",
    "probabilistic-programming",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "arviz>=1.2.0",
    "beartype>=0.22",
    # <0.11.1 until numpyro releases pyro-ppl/numpyro#2245 (render_model provenance on jax 0.11.1)
    "jax>=0.10.0,<0.11.1",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.8,<3.11",
    "numpyro>=0.20.0",
]

[project.optional-dependencies]
dataframes = [
    "pandas>=2.2",
    "polars>=1.0",
]
optax = [
    "optax>=0.2",
]
blackjax = [
    "blackjax>=1.6,<2",
]
dev = [
    "graphviz>=0.20",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbmake>=1.5",
    "prek>=0.4.5",
    "preliz>=0.16",
    "pytest-cov>=5.0",
    "pytest-split>=0.10",
    "pytest-xdist",
    "pytest>=8.0",
    "ruff==0.16.3",
    "ty==0.0.72",
    "optax>=0.2",
    "blackjax>=1.6,<2",
    "huggingface-hub>=1.22.0",
    "scikit-learn>=1.6",
]
docs = [
    "great-docs>=0.14",
]
cuda = ["jax[cuda12]"]
all = ["numpyro_forecast[dataframes,optax,blackjax,dev,docs]"]
all_cuda = ["numpyro_forecast[dataframes,optax,blackjax,dev,docs,cuda]"]

[project.urls]
Homepage = "https://juanitorduz.github.io"
Repository = "https://github.com/juanitorduz/numpyro_forecast"
Issues = "https://github.com/juanitorduz/numpyro_forecast/issues"

[tool.hatch.build.targets.wheel]
packages = ["numpyro_forecast"]

[tool.uv]
default-groups = []

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 99
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "S", "UP", "W"]
ignore = [
    "B008",
    "B904",
    "RUF001",
    "RUF002",
    "RUF012",
    # jaxtyping shape strings are parsed by ruff as forward annotations. Per the
    # jaxtyping FAQ we disable only F722 globally and prepend a leading space to
    # each shape string (e.g. Float[Array, " sample *batch"]) so the residual
    # F821 "undefined name" check stays active for real bugs.
    "F722",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "S101",
]
"docs/examples/*" = [
    "B018",
    "D103",
    "E402",
    "E702",
    "E703",
    # jaxtyping's runtime shape checks use `assert isinstance(x, Float[Array, ...])`.
    "S101",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=numpyro_forecast",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--no-cov-on-fail",
    "--durations=50",
    "--color=yes",
]

[tool.coverage.run]
source = ["numpyro_forecast"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
# TODO(refactor3): temporary during the v0.3.0 integration window; example
# notebooks still call the pre-refactor API and are re-typechecked as they
# are rewritten (PR-A Task 12, PR-E). Remove this exclude at the integration
# merge.
#
# This is the mechanism that actually works: the vendored `ty` pre-commit hook
# hardcodes `pass_filenames: false` and `always_run: true` (it always checks
# the whole project, by design, since a change in one file can surface new
# diagnostics in another), so a per-file `exclude:`/`files:` key on the hook
# in .pre-commit-config.yaml has no effect. Excluding here, in ty's own
# project config, is what `ty check`/`uv check` (used by both the hook and
# CI) actually honor.
exclude = [
    "docs/examples/electricity_forecast.ipynb",
    "docs/examples/electricity_forecast_calibration.ipynb",
    "docs/examples/hierarchical_forecasting_1.ipynb",
    "docs/examples/hierarchical_forecasting_2.ipynb",
]

[tool.ty.environment]
python-version = "3.12"
