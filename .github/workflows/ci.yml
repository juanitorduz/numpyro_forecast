name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: make setup
      - name: prek check
        uses: j178/prek-action@v2
        env:
          SKIP: no-commit-to-branch

  test:
    runs-on: ubuntu-latest
    needs: prek
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: make setup
      - run: make tests

  # Base leg (no optional extras): importing the package must not pull in
  # optax/blackjax/pandas (invariant I8). Kept separate from the full suite so a
  # regression that eagerly imports an extra fails even when extras are absent.
  base-import:
    runs-on: ubuntu-latest
    needs: prek
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-default-groups
      - name: import isolation
        run: |
          uv run python -c "import sys, numpyro_forecast; leaked=[m for m in ('optax','blackjax','pandas','polars') if m in sys.modules]; assert not leaked, leaked; print('base import OK')"
