name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactor3]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: make setup
      - name: prek check
        uses: j178/prek-action@v3.0.0
        env:
          SKIP: no-commit-to-branch

  # The suite is split into duration-balanced groups (pytest-split) that run as
  # parallel jobs. Group balance comes from the committed .test_durations file;
  # refresh it with `make store-durations` when runtimes drift.
  test:
    runs-on: ubuntu-latest
    needs: prek
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: make setup
      - run: uv run pytest --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Base leg (no optional extras): importing the package must not pull in
  # optax/blackjax/pandas (invariant I8). Kept separate from the full suite so a
  # regression that eagerly imports an extra fails even when extras are absent.
  base-import:
    runs-on: ubuntu-latest
    needs: prek
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-default-groups
      - name: import isolation
        # pandas is deliberately absent from the leak list: it is a hard
        # transitive dependency of arviz/xarray (imported at module top by
        # convert.py), so it is always present and always imported. Only
        # optax, blackjax, and polars are meaningful extras-leak signals.
        run: |
          uv run python -c "import sys, numpyro_forecast; leaked=[m for m in ('optax','blackjax','polars') if m in sys.modules]; assert not leaked, leaked; print('base import OK')"
