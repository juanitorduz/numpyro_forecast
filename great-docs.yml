# API Reference Structure
# -----------------------
# Customize the sections below to organize your API documentation.
# - Reorder items within a section to change their display order
# - Move items between sections or create new sections
# - Use 'members: false' to exclude methods from documentation
# - Add 'desc:' to sections for descriptions

reference:
  - title: Model building blocks
    desc: Plain model functions that register the train/forecast sites for you.
    contents:
      - models.Horizon
      - models.Transition
      - models.Advance
      - models.innovations
      - models.markov_series
      - models.ssoe
      - models.SSOEMean
      - models.SSOEUpdate
      - models.SSOEResult
      - models.predict
      - models.PlateName

  - title: Vector autoregression
    desc: "VAR components that compose with `ssoe` and `markov_series`: conditional mean, step factory, companion matrix, impulse responses."
    contents:
      - var.var_mean
      - var.var_step
      - var.companion_matrix
      - var.impulse_response

  - title: Priors
    desc: Shrinkage prior moments for coefficient arrays.
    contents:
      - priors.minnesota_prior

  - title: Distribution surgery
    desc: Time-axis operations on observation distributions, extensible via singledispatch.
    contents:
      - surgery.shift_loc
      - surgery.slice_time
      - surgery.prefix_condition
      - surgery.register_elementwise

  - title: Reparameterization
    desc: Time-axis reparameterization of in-sample latents (Haar / DCT), after Pyro's `time_reparam`.
    contents:
      - reparam.time_reparam

  - title: Producing draws
    desc: Drawing posterior samples and generating forecasts and in-sample predictions.
    contents:
      - predictive.draw_posterior
      - predictive.forecast
      - predictive.predict_in_sample

  - title: Backtesting & evaluation
    desc: Rolling-window backtesting and forecast metrics.
    contents:
      - evaluate.backtest
      - evaluate.backtest_vectorized
      - evaluate.BacktestResult
      - evaluate.VectorizedBacktestResult
      - evaluate.evaluate_forecast
      - evaluate.results_to_dataframe
      - evaluate.eval_crps
      - evaluate.eval_mae
      - evaluate.eval_rmse
      - evaluate.eval_coverage
      - metrics.crps_empirical
      - metrics.eval_pinball
      - metrics.eval_interval_score
      - metrics.make_mase

  - title: ArviZ export
    desc: Convert posteriors into ArviZ-schema xarray DataTrees for diagnostics and plotting.
    contents:
      - convert.to_datatree
      - convert.add_forecast_groups
      - convert.predictions_to_datatree

  - title: Extensions (contrib)
    desc: Optional backends behind pyproject extras (never imported by default).
    contents:
      - contrib.blackjax.BlackjaxNUTSKernel
      - contrib.blackjax.BlackjaxMCLMCKernel
      - contrib.blackjax.BlackjaxCustomKernel
      - contrib.blackjax.PathfinderFit
      - contrib.blackjax.fit_pathfinder
      - contrib.blackjax.pathfinder_samples
      - contrib.blackjax.MultiPathfinderFit
      - contrib.blackjax.fit_multipathfinder
      - contrib.blackjax.multipathfinder_samples

  - title: Typing
    desc: Public type contracts.
    contents:
      - typing.ForecastModel
      - typing.ForecastFn
      - typing.Guide
      - typing.InSampleFn
      - typing.Metric
      - typing.ModelFactory

  - title: Autocorrelation
    desc: Batched autocorrelation and partial autocorrelation diagnostics.
    contents:
      - acf.acf
      - acf.pacf

  - title: Seasonal features
    desc: Fourier design matrices and seasonal tiling.
    contents:
      - features.fourier_features
      - features.periodic_repeat

  - title: Array helpers
    desc: Time-axis array shaping for the train/forecast split.
    contents:
      - arrays.zero_data_like
      - arrays.concat_future
      - arrays.pad_future

  - title: Datasets
    desc: Example datasets used in the tutorials.
    contents:
      - datasets.load_bart_weekly
      - datasets.load_bart_hierarchical
      - datasets.load_victoria_electricity
      - datasets.bart_available

  - title: Optional dependencies
    desc: Lazy imports behind pyproject extras.
    contents:
      - optional.require

  - title: Exceptions
    desc: Package exception hierarchy raised at validation boundaries.
    contents:
      - exceptions.NumpyroForecastError
      - exceptions.BacktestWindowError
      - exceptions.VectorizedMetricError
      - exceptions.KernelConfigError
      - exceptions.CovariateDimsError
      - exceptions.MVNLayoutError
      - exceptions.DeviceMemoryError
      - exceptions.HostMemoryKindError
      - exceptions.DevicePlatformError

# Example notebooks live in docs/examples/. The .qmd wrapper pages that embed
# their stored outputs are generated at build time by scripts/build_docs.py
# (no re-execution), so only the notebooks themselves are committed.
sections:
  - title: Examples
    dir: docs/examples
    index: true
    index_columns: 2

# Versioned Documentation
# ------------------------
# The `versions:` block is injected at build time by scripts/build_docs.py (and
# removed again afterwards), so it is deliberately absent here: the newest
# semver git tag becomes the stable site root and this checkout becomes
# /v/dev/, with the release's API snapshot generated on demand into the
# gitignored .great-docs-cache/. Releases therefore need no docs steps; see the
# Documentation section of AGENTS.md.

# GitHub Integration
# ------------------
# Repository URL is auto-detected from the git remote / pyproject URLs.
github_style: widget

# Site URL
# --------
# Canonical address of the deployed documentation site.
# Required for subdirectory deployments, skills page install commands,
# .well-known/ discovery, and sitemaps.
site_url: "https://juanitorduz.github.io/numpyro_forecast/"

# Agent Skills (skill.md)
# -----------------------
# great-docs auto-generates skill.md (served at /skill.md and under
# /.well-known/agent-skills/) from pyproject.toml and the reference: sections
# above. The API overview stays generated; the entries below are the
# hand-maintained part and encode the conventions of AGENTS.md that cannot be
# inferred from docstrings. Keep them in sync with AGENTS.md and the README.
skill:
  decision_table:
    - need: "Derive the train/forecast split inside a model"
      use: "Horizon.from_data(covariates, data)"
    - need: "Per-step iid latent innovations (random-walk level, local trend)"
      use: "innovations(h, name, prior); build the series with jnp.cumsum(drift, axis=-2)"
    - need: "Latent whose per-step distribution depends on the previous state"
      use: "markov_series(h, name, init_carry, transition, advance=...)"
    - need: "Single-source-of-error recursion (ARMA, exponential smoothing, Croston, TSB)"
      use: "ssoe(h, name, y, init_carry, mean, update, noise_dist)"
    - need: "Register the likelihood over the training window and the forecast site"
      use: "predict(h, obs_dist, prediction)"
    - need: "Vector autoregression"
      use: "var.var_step(...) as the mean/update pair of ssoe; priors.minnesota_prior for shrinkage"
    - need: "Posterior draws from a fitted SVI guide"
      use: "draw_posterior(rng_key, guide, params, num_samples)"
    - need: "Forecast over the horizon"
      use: "forecast(rng_key, model, posterior, data, covariates)"
    - need: "In-sample posterior predictive"
      use: "predict_in_sample(rng_key, model, posterior, covariates)"
    - need: "ArviZ DataTree with posterior, in-sample predictive, forecasts and observed data"
      use: "to_datatree(rng_key, model, posterior, data, covariates)"
    - need: "Rolling or expanding window backtest with scores per window"
      use: "backtest(rng_key, data, covariates, model_fn, forecast_fn=...); backtest_vectorized for one vmapped SVI fit"
    - need: "Better SVI or NUTS geometry for a random-walk level"
      use: "time_reparam(model, \"dct\") or time_reparam(model, \"haar\"), created once and reused"
    - need: "BlackJAX samplers or Pathfinder"
      use: "contrib.blackjax.BlackjaxNUTSKernel / BlackjaxMCLMCKernel with MCMC; fit_multipathfinder + multipathfinder_samples"
  gotchas:
    - "Array layout is time at axis -2 and the observation dim at -1, batch dims to the left: a univariate series is shape (time, 1), not (time,)."
    - "There is no horizon argument. The forecast horizon is covariates.shape[-2] - data.shape[-2]: fit with covariates[:t_obs] and forecast with the full-horizon covariates, using the same model function."
    - "Every function that consumes randomness takes rng_key as its first positional argument (draw_posterior, forecast, predict_in_sample, to_datatree, backtest)."
    - "The drivers read the sites \"obs\" and \"forecast\" by name. Never put predict (or hand-written obs/forecast sites) inside handlers.scope; scope only the latent building blocks."
    - "innovations is called inside plates you open yourself; markov_series rejects an enclosing plate and takes plates=[(name, size)] instead."
    - "ssoe registers only the <name>_future error site: write the likelihood against result.mu yourself and register numpyro.deterministic(\"forecast\", result.y_future) when h.future > 0. Its mean and update functions must not call numpyro.sample."
    - "innovations, ssoe and predict take distribution instances (dist.Normal(0.0, scale)), not distribution classes or thunks."
    - "predict_in_sample and to_datatree call the model with data=None, so anything the model needs at prediction time must travel through covariates, never through h.data."
    - "time_reparam returns a wrapped model: create it once and hand that same object to the guide, SVI/MCMC, forecast, predict_in_sample, to_datatree and backtest; wrapping inside a loop recompiles, and nesting two time_reparam calls raises ValueError."
    - "draw_posterior is for variational guides only; MCMC users pass mcmc.get_samples() and Pathfinder users multipathfinder_samples(...) to the same drivers."
    - "numpyro_forecast.contrib.blackjax is never imported by default and needs the blackjax extra (pip install \"numpyro_forecast[blackjax]\"); optax optimizers need the optax extra and numpyro.optim.optax_to_numpyro."
  best_practices:
    - "Keep inference plain NumPyro: SVI with an autoguide or MCMC with any kernel; nothing in the package wraps svi.run or mcmc.run."
    - "Use LocScaleReparam(0) on innovations priors for SVI, and time_reparam(model, \"dct\") when the latent is a random-walk level."
    - "On a GPU, call numpyro.set_platform(\"cuda\") before building the model and pass batch_size and device=\"host\" to draw_posterior, forecast and predict_in_sample so the draws never sit on the accelerator at once; draws come back as jax Arrays on the CPU device or NumPy arrays."
    - "Score forecasts with eval_crps and eval_coverage on held-out data, and backtest over rolling origins rather than trusting a single split."
    - "Write integers with four or more digits with underscores (1_000, 10_000) and thread PRNG keys explicitly with jax.random.split."

# Make embedded notebook output images responsive so wide matplotlib figures
# fit the content column instead of overflowing (they carry explicit
# width/height attributes and lack Bootstrap's .img-fluid class).
include_in_header:
  - text: |
      <style>
      .cell-output-display img { max-width: 100%; height: auto; }
      </style>

# Site Settings
# -------------
# site:
#   theme: flatly              # Quarto theme (default: flatly)
#   toc: true                  # Show table of contents (default: true)
#   toc-depth: 2               # TOC heading depth (default: 2)
#   toc-title: On this page    # TOC title (default: "On this page")

# Jupyter Kernel
# --------------
# Jupyter kernel to use for executing code cells in .qmd files.
# This is set at the project level so it applies to all pages, including
# auto-generated API reference pages. Can be overridden in individual .qmd
# file frontmatter if needed for special cases.
jupyter: python3

