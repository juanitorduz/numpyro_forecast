ci:
  autofix_prs: false

repos:
  # ruff and ty run via `uv run` from a local hook so their versions come from
  # the project's `.venv` (uv.lock) rather than an isolated, independently
  # pinned pre-commit environment. This keeps the hooks in lockstep with local
  # development and CI; bump them with uv (e.g. `uv lock --upgrade-package ruff`)
  # and the hooks follow automatically.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --output-format=full
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run ty check numpyro_forecast/
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: debug-statements
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^(docs/examples/)
