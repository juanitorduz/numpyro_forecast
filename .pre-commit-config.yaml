ci:
  autofix_prs: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--output-format=full"]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.56
    hooks:
      - id: ty
        exclude: ^docs/examples/
        # TODO(refactor3): temporary during the v0.3.0 integration window; example
        # notebooks still call the pre-refactor API and are re-typechecked as they
        # are rewritten (PR-A Task 12, PR-E). Remove this exclude at the integration merge.
        #
        # Note: the vendored hook hardcodes pass_filenames: false and
        # always_run: true (it always checks the whole project), so this
        # per-file exclude alone does not stop it from scanning docs/examples/;
        # the exclusion that actually takes effect is [tool.ty.src] in
        # pyproject.toml, which `ty check`/`uv check` honor directly. Keep both
        # in sync and remove both at the integration merge.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: debug-statements
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^(docs/examples/)
